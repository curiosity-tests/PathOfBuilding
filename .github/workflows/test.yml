name: Run Tests

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch gains leg/profile/racecar_run inputs, so racecar can
#      drive a run and select baseline vs instrumented.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#      `chalk:` is the single variable separating the two arms.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block also zeroes every unlisted scope, so contents: read is restated.
#   4. A fail-closed assertion on the instrumented arm.
# Build and test COMMANDS are byte-identical to upstream, and both jobs keep
# running inside the upstream pathofbuilding-tests container.

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

run-name: "Run Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely: no chalk, no curiosity, no residue.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  run_tests:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      # The upstream test image is alpine-minirootfs 3.18 and ships no bash.
      # Upstream's own steps survive that because GitHub's default shell falls
      # back to sh, but action-checkout's "Detect LFS" step hardcodes
      # `shell: bash` and dies with exit 127. Same reason upstream already
      # `apk add git` in check_modcache: install a tool an action needs. No
      # build or test command is affected.
      - name: Install bash dependency
        run: apk add --no-cache bash
      - name: Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected so it does not cascade into every
      # child, so an empty LD_PRELOAD is what SUCCESS looks like from inside the
      # shell. Process name is no good either -- co-hostd daemonizes.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run tests
        run: busted --lua=luajit
  check_modcache:
    runs-on: ubuntu-latest
    container: ghcr.io/pathofbuildingcommunity/pathofbuilding-tests:latest
    steps:
      - name: Install git dependency
        run: apk add git
      # See run_tests: action-checkout's Detect LFS step needs bash, which the
      # alpine test image lacks.
      - name: Install bash dependency
        run: apk add --no-cache bash
      - name: Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false

      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Regenerate ModCache
        env:
          LUA_PATH: ../runtime/lua/?.lua;../runtime/lua/?/init.lua
          REGENERATE_MOD_CACHE: 1
        run: cd src; luajit HeadlessWrapper.lua
      - run: git config --global --add safe.directory $(pwd)
      - name: Check if the generated ModCache is different
        run: git diff --exit-code src/Data/ModCache.lua
